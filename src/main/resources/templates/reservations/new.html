<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>予約フォーム | NAGOYAMESHI</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container py-5">

		<div class="row justify-content-center">
			<div class="col-12 col-md-8 col-lg-6">

				<div class="card border-0 shadow-sm rounded-4">

					<div class="card-body p-4 p-md-5">

						<h2 class="text-center fw-bold mb-2">
							店舗予約
						</h2>

						<p class="text-center text-muted mb-4">
							ご希望の日時と人数を入力してください
						</p>

						<!-- エラーメッセージ -->
						<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
						</div>

						<!-- 予約フォーム -->
						<form id="reservationForm" th:action="@{/reservations/{shopId}(shopId=${shopId})}"
							method="post">

							<input type="hidden" name="shopId" th:value="${shopId}">


							<!-- 予約日 -->
							<div class="mb-4">
								<label for="reservationDay" class="form-label fw-semibold">
									予約日
								</label>

								<input type="date" id="reservationDay" class="form-control form-control-lg" required
									th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
							</div>

							<!-- 予約時間 -->
							<div class="mb-4">
								<label for="reservationTime" class="form-label fw-semibold">
									予約時間
								</label>

								<select id="reservationTime" class="form-select form-select-lg" required>
									<option value="" selected disabled>
										時間を選択してください
									</option>
									<option value="11:00">11:00</option>
									<option value="12:00">12:00</option>
									<option value="13:00">13:00</option>
									<option value="14:00">14:00</option>
									<option value="15:00">15:00</option>
									<option value="16:00">16:00</option>
									<option value="17:00">17:00</option>
									<option value="18:00">18:00</option>
									<option value="19:00">19:00</option>
									<option value="20:00">20:00</option>
									<option value="21:00">21:00</option>
								</select>
							</div>

							<!-- Controllerへ送る予約日時 -->
							<input type="hidden" id="reservationDate" name="reservationDate">

							<!-- 予約人数 -->
							<div class="mb-4">
								<label for="numPeople" class="form-label fw-semibold">
									予約人数
								</label>

								<select id="numPeople" name="numPeople" class="form-select form-select-lg" required>

									<option value="" selected disabled>
										人数を選択してください
									</option>

									<option th:each="i : ${#numbers.sequence(1, 10)}" th:value="${i}"
										th:text="${i + '名'}">
									</option>

								</select>
							</div>

							<!-- 注意事項 -->
							<div class="alert alert-light border small text-muted mb-4">
								※ 予約できるのは有料会員のみです。<br>
								※ 予約のキャンセルは前日まで可能です。
							</div>

							<!-- 予約ボタン -->
							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg fw-bold">
									予約を確定する
								</button>
							</div>

						</form>

						<!-- 戻るリンク -->
						<div class="text-center mt-4">
							<a th:href="@{/shops/{id}(id=${shopId})}" class="text-decoration-none">
								← 店舗詳細へ戻る
							</a>
						</div>

					</div>
				</div>

			</div>
		</div>

	</div>


	<script>
		document.getElementById("reservationForm")
			.addEventListener("submit", function (event) {

				const day = document.getElementById("reservationDay").value;
				const time = document.getElementById("reservationTime").value;

				if (!day || !time) {
					event.preventDefault();
					alert("予約日と予約時間を選択してください。");
					return;
				}

				// 日付と時間を結合してControllerへ送信
				document.getElementById("reservationDate").value =
					day + "T" + time;
			});
	</script>

</body>

</html>
