<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>予約一覧 | NAGOYAMESHI</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- 既存のCSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
	
	<style>
    /* 予約キャンセルボタンにカーソルを当てたとき */
    .reservation-cancel-btn:hover {
        background-color: #dc3545 !important;
        color: white !important;
        border-color: #dc3545 !important;
    }
</style>

</head>

<body class="bg-light">

	<!-- 共通ヘッダー -->
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container py-5">

		<div class="row justify-content-center">
			<div class="col-12 col-lg-8">

				<h2 class="fw-bold mb-4">予約一覧</h2>

				<!-- キャンセル成功メッセージ -->
				<div th:if="${param.reservationDeleted}" class="alert alert-success">
					予約をキャンセルしました
				</div>

				<!-- 予約がない場合 -->
				<div th:if="${#lists.isEmpty(reservations)}" class="card border-0 shadow-sm rounded-4">

					<div class="card-body text-center p-5">
						<p class="text-muted mb-3">
							予約はまだありません。
						</p>

						<a th:href="@{/shops}" class="btn btn-primary">
							店舗を探す
						</a>
					</div>
				</div>

				<!-- 予約一覧 -->
				<div th:if="${!#lists.isEmpty(reservations)}">

					<div th:each="reservation : ${reservations}" class="card border-0 shadow-sm rounded-4 mb-4">

						<div class="card-body p-4">

							<!-- 店舗名 -->
							<h4 class="fw-bold mb-3" th:text="${reservation.shop.name}">
								店舗名
							</h4>

							<hr>

							<!-- 予約日 -->
							<p class="mb-3">
								<span class="fw-semibold">予約日：</span>
								<span th:text="${reservation.reservedDate}">
								</span>
							</p>

							<!-- 予約時間 -->
							<p class="mb-3">
								<span class="fw-semibold">予約時間：</span>
								<span th:text="${reservation.reservedTime}">
								</span>
							</p>

							<!-- 予約人数 -->
							<p class="mb-3">
								<span class="fw-semibold">予約人数：</span>
								<span th:text="${reservation.numberOfPeople}">
								</span>名
							</p>

							<!-- キャンセル可能な予約 -->
							<div th:if="${reservation.reservedDate.isAfter(T(java.time.LocalDate).now())}">

								<span class="badge bg-success mb-3">
									予約中
								</span>

								<form th:action="@{/reservations/delete/{id}(id=${reservation.id})}" method="post">


									<button type="submit" class="btn btn-outline-danger reservation-cancel-btn" style="width: auto;
                                       background-color: transparent;
                                       color: #dc3545;
                                       border: 1px solid #dc3545;" onclick="return confirm('この予約をキャンセルしますか？');">
										予約をキャンセル
									</button>


								</form>
							</div>

							<!-- 当日・過去の予約 -->
							<div th:unless="${reservation.reservedDate.isAfter(T(java.time.LocalDate).now())}">

								<span class="badge bg-secondary">
									キャンセル不可
								</span>

							</div>

						</div>
					</div>

				</div>

				<!-- マイページに戻る -->
				<div class="text-center mt-4">
					<a th:href="@{/mypage}" class="text-decoration-none">
						← マイページに戻る
					</a>
				</div>

			</div>
		</div>
	</div>

</body>

</html>
